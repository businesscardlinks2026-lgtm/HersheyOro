<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173c35">
  <title>Hershey May Bantug Oro | Digital Business Card</title>
  <style>
    :root {
      --green: #173c35;
      --green-soft: #e9f0ec;
      --ink: #202b28;
      --muted: #687570;
      --line: #e1e8e4;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f6f4;
      color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 430px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: 0 18px 55px rgba(24, 54, 45, .09);
    }
    .top {
      padding: 30px 28px 27px;
      color: #fff;
      background: var(--green);
      position: relative;
    }
    .monogram {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 50%;
      color: #fff;
      font-family: Georgia, serif;
      font-size: 20px;
      letter-spacing: 1px;
    }
    .eyebrow {
      margin: 0 0 9px;
      color: #c6d9d0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.1px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      max-width: 340px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(27px, 7vw, 34px);
      font-weight: 500;
      line-height: 1.13;
      letter-spacing: -.5px;
    }
    .role {
      margin: 13px 0 0;
      color: #e0e9e4;
      font-size: 14px;
      line-height: 1.55;
    }
    .company {
      display: block;
      margin-top: 5px;
      color: #c6d9d0;
      font-size: 12px;
      letter-spacing: .3px;
      line-height: 1.6;
    }
    .content { padding: 25px 28px 28px; }
    .section-label {
      margin: 0 0 15px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }
    .contact-row {
      display: flex;
      gap: 13px;
      align-items: center;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
      min-width: 0;
    }
    .contact-row:last-of-type { border-bottom: 0; }
    .icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--green-soft);
      color: var(--green);
    }
    .icon svg { width: 17px; height: 17px; }
    .detail { min-width: 0; }
    .detail-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 11px;
    }
    .detail a, .detail span.value {
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .detail a:hover { text-decoration: underline; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 23px;
    }
    .btn {
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
      border: 1px solid var(--green);
      border-radius: 10px;
      background: var(--green);
      color: white;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      cursor: pointer;
    }
    .btn.secondary {
      background: #fff;
      color: var(--green);
    }
    .footer {
      padding: 15px 20px;
      border-top: 1px solid var(--line);
      color: #84908b;
      font-size: 10px;
      letter-spacing: 1.1px;
      text-align: center;
      text-transform: uppercase;
    }
    @media (max-width: 360px) {
      .top, .content { padding-left: 21px; padding-right: 21px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="top">
      <div class="monogram" aria-hidden="true">HO</div>
      <p class="eyebrow">Digital Business Card</p>
      <h1>Hershey May<br>Bantug Oro</h1>
      <p class="role">
        Assistant Vice President<br>
        Branch Manager
        <span class="company">
          Bukidnon Valencia Branch<br>
          Security Bank Corp.
        </span>
      </p>
    </header>

    <section class="content" aria-label="Contact details">
      <p class="section-label">Contact Information</p>

      <div class="contact-row">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h4l2 5-2.5 1.8a15 15 0 0 0 5.7 5.7L16 13l5 2v4c0 1.1-.9 2-2 2C10 21 3 14 3 5c0-1.1.9-2 2-2Z"/></svg>
        </div>
        <div class="detail">
          <span class="detail-label">Mobile</span>
          <a href="tel:+639178670560">0917 867 0560</a>
        </div>
      </div>

      <div class="contact-row">
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
        </div>
        <div class="detail">
          <span class="detail-label">Email</span>
          <a href="mailto:hershey.oro@securitybank.com.ph">hershey.oro@securitybank.com.ph</a>
        </div>
      </div>

      <div class="actions">
        <a class="btn" href="tel:+639178670560">Call Mobile</a>
        <a class="btn secondary" href="mailto:hershey.oro@securitybank.com.ph">Send Email</a>
      </div>
    </section>
    <footer class="footer">Connect · Collaborate · Build Relationships</footer>
  </main>
</body>
</html>
